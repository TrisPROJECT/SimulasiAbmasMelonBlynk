[env:esp32-s3-devkitc-1]
platform = espressif32 @ ~6.6.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/RTClib @ ^2.1.4
    blynkkk/Blynk @ ^1.3.2